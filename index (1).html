<style>
/* ===== Tokens (Riortech claymorphism) ===== */

*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--n);min-height:100vh}
h1,h2,h3{line-height:1.2;color:var(--n)}h1{font-size:1.6rem}h2{font-size:1.15rem}h3{font-size:1rem}
p,.mut{color:var(--m)}

.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.lg{width:56px;height:56px;flex:none}
#v{max-width:760px;margin:0 auto;padding:20px 16px calc(100px + env(safe-area-inset-bottom));outline:0}
.card{background:var(--w);border-radius:22px;box-shadow:var(--clay);padding:18px;margin-bottom:16px}

.btn{min-height:48px;border:0;border-radius:16px;padding:0 20px;font:600 1rem inherit;font-family:inherit;cursor:pointer;display:inline-flex;gap:8px;align-items:center;justify-content:center;transition:transform .15s,box-shadow .15s;text-decoration:none}
.btn:active{transform:scale(.98);box-shadow:var(--press)}

.sec{background:var(--w);color:var(--n);box-shadow:var(--clay)}
.out{background:transparent;color:var(--b);border:2px solid var(--b)}

.dng{background:var(--er);color:#fff}
.blk{width:100%}
.ib{width:44px;height:44px;border-radius:14px;border:0;background:var(--w);color:var(--n);box-shadow:var(--clay);display:grid;place-items:center;cursor:pointer}

dialog{border:0;border-radius:22px;padding:22px;max-width:min(420px,92vw);width:100%;box-shadow:0 20px 60px rgba(11,21,48,.3);color:var(--n)}dialog::backdrop{background:rgba(11,21,48,.45)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));background:var(--n);color:#fff;padding:12px 18px;border-radius:14px;z-index:60;font-size:.92rem;max-width:90vw}
/* skeleton */
.sk{background:linear-gradient(90deg,#e1e8f8 25%,#ffffff 50%,#e1e8f8 75%);background-size:200% 100%;animation:sh 1.35s infinite;border-radius:12px;height:16px;margin:10px 0;min-width:40px}
.sk.h{height:90px;border-radius:18px}.sk.s{width:55%}
[aria-busy=true]>.card{padding:20px;min-height:112px}
@keyframes sh{to{background-position:-200% 0}}

nav .logo{display:flex;margin-bottom:18px;padding:0 6px}.bdg{position:static}
.cols{grid-template-columns:repeat(var(--n),1fr)}.dc:not(.sel){display:block}.tabs{display:none}.cls{grid-template-columns:1fr}.dc h3.dh{display:block}
}

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendPasswordResetEmail, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, deleteDoc, collection, getDocs, writeBatch, serverTimestamp, query, where, orderBy, limit } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";
/* ============================================================
   Student Hub by Riortech — Firebase-connected frontend prototype
   Sections: 1 Config · 2 Service layer · 3 Helpers
             4 State · 5 Views · 6 Router · 7 Reminders · 8 Boot
   ============================================================ */

/* ---------- 1. CONFIG ----------
   Public Firebase web configuration. Never put service-account keys or private credentials here. */
const CFG = { firebase: {
  apiKey: "AIzaSyBaEb5TlQ7jPn471V12tK3G4SA_I6ZbHEA",
  authDomain: "class-pulse-6da11.firebaseapp.com",
  projectId: "class-pulse-6da11",
  storageBucket: "class-pulse-6da11.firebasestorage.app",
  messagingSenderId: "769863664036",
  appId: "1:769863664036:web:4b6bf577be66c7ae8d4131",
  measurementId: "G-EZ01N26T2L"
} };
const KEY = 'studenthub_demo_v1'; // Legacy local cache key; authenticated data is stored in Firestore.
const TERMS_VERSION = '2026-10-21-draft-1';
const firebaseApp = initializeApp(CFG.firebase);
const auth = getAuth(firebaseApp);
const db = getFirestore(firebaseApp);
let authReady = false;
let currentUid = null;

/* ---------- 2. SERVICE LAYER ----------
   Student data is stored under users/{uid}; each class has its own document.
   Firestore rules must enforce request.auth.uid == uid. Admin publishing stays disabled. */
const Svc = {
  isDemo: () => false,
  async signIn(email, pw, create) {
    const credential = create
      ? await createUserWithEmailAndPassword(auth, email, pw)
      : await signInWithEmailAndPassword(auth, email, pw);
    currentUid = credential.user.uid;
    return { email: credential.user.email, uid: credential.user.uid };
  },
  async googleSignIn() { throw new Error('Google sign-in is not enabled in this build.'); },
  async resetPassword(email) { return sendPasswordResetEmail(auth, email); },
  async signOut() { await signOut(auth); currentUid = null; },
  async load() {
    if (!auth.currentUser) return {};
    currentUid = auth.currentUser.uid;
    const userRef = doc(db, 'users', currentUid);
    const snap = await getDoc(userRef);
    const profileData = snap.exists() ? snap.data() : {};
    const classesSnap = await getDocs(collection(db, 'users', currentUid, 'classes'));
    const classes = classesSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    return { signedIn: true, email: auth.currentUser.email || '', profile: profileData.profile || null,
      prefs: profileData.prefs || { on: false, min: 30, sun: false }, read: profileData.read || {}, classes,
      termsAccepted: profileData.termsAccepted || null };
  },
  async save(data) {
    const user = auth.currentUser;
    if (!user) throw new Error('Please sign in to save your timetable.');
    const uid = user.uid;
    currentUid = uid;
    const classes = Array.isArray(data.classes) ? data.classes : [];
    // Keep the user document aligned with the Firestore rules. UI-only state is never written.
    const profileData = {
      email: user.email || '',
      profile: data.profile || null,
      prefs: data.prefs || { on: false, min: 30, sun: false },
      read: data.read || {},
      ...(data.termsAccepted ? { termsAccepted: data.termsAccepted } : {}),
      updatedAt: serverTimestamp()
